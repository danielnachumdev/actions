name: CI

# Thin orchestrator. Prefer requiring check "CI / CI".
# Umbrella auto-detects lanes from layout (pyproject, package.json, .github/,
# alembic, terraform/, .raft/). Override or disable-* only when needed.
# Add Semver (job below + "Semver / Semver" required check) ONLY if this repo
# publishes versions (releases/tags/wheels). Apps/sites/infra: omit semver.
#
# Prefer @latest (CD moves floating latest after each release).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  id-token: write # Terraform plan/apply when WIF inputs are passed

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    # secrets:
    #   VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}   # unlocks raft when .raft/ + raft-service/git-repo set
    # with:
    #   working-directory: .
    #   # Unlock terraform plan/apply (validate still runs from versions.tf alone):
    #   workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
    #   service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
    #   # Unlock raft (also needs .raft/ + secrets.VPS_SSH_KEY):
    #   # raft-service: my-app
    #   # raft-git-repo: git@github.com:org/repo.git
    #   # disable-python: false
    #   # disable-node: false
    #   # disable-github-yaml: false
    #   # disable-rebase-guard: false
    #   # disable-terraform: false
    #   # disable-terraform-apply: false
    #   # disable-raft: false
    #   # python-versions: '["3.11","3.12","3.13"]'
    #   # python-versions-push: '["3.11","3.13"]'
    #   # node-versions: '["22"]'   # empty → infer .nvmrc / engines
    #   # sync-args: "--group dev"  # empty → infer from pyproject groups
    #   # pytest-command: "pytest -q"
    #   # allow-empty: false

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: danielnachumdev/actions/.github/workflows/semver-ci.yml@latest
    with:
      standards-ref: latest
      # timeout-minutes: 5

  # Opt-in: Agent Skills validation (repo-root */SKILL.md). Not auto-detected.
  # Prefer requiring check "Validate skills / Validate skills".
  # validate-skills:
  #   name: Validate skills
  #   uses: danielnachumdev/actions/.github/workflows/validate-skills.yml@latest
  #   # with:
  #   #   working-directory: .

  # Opt-in: merge Dependabot PRs after sibling CI jobs pass (default off).
  # Must needs: every PR job that must pass first so this runs last in the
  # workflow graph (with Semver: needs: [ci, semver]; without: needs: [ci];
  # with skills validate: needs: [ci, validate-skills]).
  # Custom orchestrators with an aggregate success job: needs: that aggregate.
  # If that aggregate uses if: always() while path-filtered siblings may be
  # skipped, gate with always() && needs.<id>.result == 'success' && dependabot
  # (see HOW-TO-USE.md) or DAM is skipped while CI is green.
  # If classic branch protection requires code-owner reviews with review count 0,
  # set require_code_owner_reviews=false so Dependabot can land after required checks.
  # dependabot-auto-merge:
  #   name: Merge Dependabot PR
  #   needs: [ci, semver]
  #   if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
  #   permissions:
  #     contents: write
  #     pull-requests: write
  #   uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest
