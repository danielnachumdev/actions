name: CI

# Thin orchestrator. Prefer requiring check "CI / CI".
# Add Semver (job below + "Semver / Semver" required check) ONLY if this repo
# publishes versions (releases/tags/wheels). Apps/sites/infra: omit semver.
# Semver at CI = validate exactly one of: noBump | bumpPatch | bumpMinor | bumpMajor
#
# Prefer @latest (CD moves floating latest after each release).
# Pin an immutable @vN.N.N when you need a freeze.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    # with:  # all optional — defaults + auto-detect pyproject.toml / package.json
    #   working-directory: .
    #   python-versions: '["3.11","3.12","3.13"]'          # shared (both events)
    #   python-versions-push: '["3.11","3.13"]'             # optional lighter post-merge
    #   node-versions: '["20","22"]'
    #   sync-args: "--group dev"
    #   pytest-command: "pytest -q"                         # full cmd under uv run (flags included)
    #   disable-python: false                                 # never run lane (any event)
    #   disable-node: false
    #   skip-node-push: true                                  # skip Node on push only
    #   # *-push omitted or "" → inherit shared (not a clear). Skip lanes via skip-*-push.
    #   # python-versions-push / node-versions-push / sync-args-push
    #   # skip-python-push / skip-node-push
    #   # Timeouts (minutes; defaults preserve prior hardcodes):
    #   # detect-timeout-minutes: 5
    #   # python-timeout-minutes: 30
    #   # node-timeout-minutes: 30
    #   # ci-timeout-minutes: 5

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: danielnachumdev/actions/.github/workflows/semver-ci.yml@latest
    with:
      standards-ref: latest
      # timeout-minutes: 5

  # Opt-in: merge Dependabot PRs after sibling CI jobs pass (default off).
  # Must needs: every PR job that must pass first so this runs last in the
  # workflow graph (with Semver: needs: [ci, semver]; without: needs: [ci]).
  # Custom orchestrators with an aggregate success job: needs: that aggregate.
  # If that aggregate uses if: always() while path-filtered siblings may be
  # skipped, gate with always() && needs.<id>.result == 'success' && dependabot
  # (see HOW-TO-USE.md) or DAM is skipped while CI is green.
  # If classic branch protection requires code-owner reviews with review count 0,
  # set require_code_owner_reviews=false so Dependabot can land after required checks.
  # dependabot-auto-merge:
  #   name: Merge Dependabot PR
  #   needs: [ci, semver]
  #   if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
  #   permissions:
  #     contents: write
  #     pull-requests: write
  #   uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest
