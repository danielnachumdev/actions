name: CI

# Thin orchestrator. Prefer requiring checks "CI / CI" and "Semver / Semver".
# Semver at CI = validate exactly one of: noBump | bumpPatch | bumpMinor | bumpMajor
#
# Pin @v1 for the stable major contract, or @latest for always-newest release.
# Prefer @v1 in production consumers.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@v1
    # with:  # all optional — defaults + auto-detect pyproject.toml / package.json
    #   working-directory: .
    #   python-versions: '["3.11","3.12","3.13"]'          # shared (both events)
    #   python-versions-push: '["3.11","3.13"]'             # optional lighter post-merge
    #   node-versions: '["20","22"]'
    #   sync-args: "--group dev"
    #   pytest-args: "-q"
    #   disable-python: false                                 # never run lane (any event)
    #   disable-node: false
    #   skip-node-push: true                                  # skip Node on push only
    #   # *-push omitted or "" → inherit shared (not a clear). Skip lanes via skip-*-push.
    #   # python-versions-push / node-versions-push / sync-args-push / pytest-args-push
    #   # skip-python-push / skip-node-push
    #   # Timeouts (minutes; defaults preserve prior hardcodes):
    #   # detect-timeout-minutes: 5
    #   # python-timeout-minutes: 30
    #   # node-timeout-minutes: 30
    #   # ci-timeout-minutes: 5

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: danielnachumdev/actions/.github/workflows/semver-ci.yml@v1
    with:
      standards-ref: v1
      # timeout-minutes: 5
