name: CI

# Thin orchestrator. Prefer requiring checks "CI / CI" and "Semver / Semver".
# Semver at CI = validate exactly one of: noBump | bumpPatch | bumpMinor | bumpMajor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@v1
    # with:  # all optional — defaults + auto-detect pyproject.toml / package.json
    #   working-directory: .
    #   python-versions: '["3.11","3.12","3.13"]'
    #   node-versions: '["20","22"]'
    #   sync-args: "--group dev"
    #   pytest-args: "-q"
    #   disable-python: false
    #   disable-node: false

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: danielnachumdev/actions/.github/workflows/semver-ci.yml@v1
    with:
      standards-ref: v1
