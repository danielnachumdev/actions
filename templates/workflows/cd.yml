name: CD

# Thin Semver CD orchestrator — use ONLY if this repo publishes versions
# (releases/tags/wheels). Apps/sites/infra: omit this file; deploy another way.
# Semver at CD = bump → wheel → GitHub Release → optional retags (or skip on
# noBump). Pass retags to force-move floating tags (e.g. latest).
# Optional PyPI:
#   Token (reusable): publish-pypi: true + PYPI_API_TOKEN
#   Trusted Publishing: publish-pypi: false + inline pypi job below (warehouse#11096)
# Pin:
#   uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@v1

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Defense in depth with the job if: (push + main). Limits which CI
    # completions even enqueue this privileged orchestrator.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read
  # Required only for caller-inlined Trusted Publishing (OIDC):
  # id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  semver:
    name: Semver
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@v1
    with:
      standards-ref: v1
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
      # Opt-in: force-move floating latest after each real release (omit/""/[] = no-op).
      retags: '["latest"]'
      # Token path: publish-pypi: true  (requires PYPI_API_TOKEN below)
      # Trusted Publishing: leave publish-pypi false; uncomment the pypi job.
      # Timeouts (minutes; defaults preserve prior hardcodes):
      # timeout-minutes: 30          # bump / build / release
      # pypi-timeout-minutes: 15
      # retag-timeout-minutes: 10
    # User-owned repos: pass secrets by name (secrets: inherit is org/enterprise only).
    # Required whenever semver-cd declares secrets: — empty OK when PyPI-off / OIDC inlined.
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # Caller-inlined Trusted Publishing (OIDC). Do not use semver-cd publish-pypi
  # for OIDC — PyPI rejects reusable workflow publishers (warehouse#11096).
  # Also uncomment permissions.id-token: write above.
