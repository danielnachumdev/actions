name: CD

# Thin Semver CD orchestrator — use ONLY if this repo publishes versions
# (releases/tags/wheels). Apps/sites/infra: omit this file; deploy another way.
# Semver at CD = bump → wheel → GitHub Release → optional retags (or skip on
# noBump). Pass retags to force-move floating tags (e.g. latest).
#
# Optional PyPI (pick one):
#   Token (in-reusable): publish-pypi: true + pypi-auth: token + PYPI_API_TOKEN
#   Trusted Publishing: keep publish-pypi: false; add an INLINE pypi job in THIS
#     file (OIDC job_workflow_ref must be this cd.yml). PyPI does not support
#     reusable workflows as Trusted Publishers (warehouse#11096) — so
#     pypi-auth: trusted-publishing on semver-cd will NOT match a publisher
#     configured for this repo's cd.yml.
# Pin:
#   uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@v1

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Defense in depth with the job if: (push + main). Limits which CI
    # completions even enqueue this privileged orchestrator.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read
  # Required by semver-cd (PyPI job declares OIDC even when skipped) and by
  # an inline Trusted Publishing job:
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  semver:
    name: Semver
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@v1
    with:
      standards-ref: v1
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
      # Opt-in: force-move floating latest after each real release (omit/""/[] = no-op).
      retags: '["latest"]'
      # --- Token path (supported inside semver-cd) ---
      # publish-pypi: true
      # pypi-auth: token
      # --- Trusted Publishing: leave publish-pypi false; uncomment inline job below ---
      # publish-pypi: false
      # Timeouts (minutes; defaults preserve prior hardcodes):
      # timeout-minutes: 30          # bump / build / release
      # pypi-timeout-minutes: 15
      # retag-timeout-minutes: 10
    # User-owned repos: pass secrets by name (secrets: inherit is org/enterprise only).
    # Required whenever semver-cd declares secrets: — needed for pypi-auth: token.
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

