name: Retag

# Thin orchestrator for standalone floating-tag moves.
# semver-cd already moves `latest` after each release. Use this to retag an
# explicit `tags` list to a SHA (recoveries, custom aliases, dry-run).
# Pin:
#   uses: danielnachumdev/actions/.github/workflows/retag.yml@v1
#
# Caller needs permissions: contents: write

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA that floating tags should point at
        type: string
        required: true
      tags:
        description: 'JSON array of tag names (e.g. ["latest"])'
        type: string
        default: '["latest"]'
      dry_run:
        description: Print planned moves without tagging or pushing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  retag:
    name: Retag
    uses: danielnachumdev/actions/.github/workflows/retag.yml@v1
    with:
      sha: ${{ inputs.sha }}
      tags: ${{ inputs.tags }}
      dry-run: ${{ inputs.dry_run }}
