# Semver at CI (PR) — require exactly one bump label.
#   uses: danielnachumdev/actions/.github/workflows/semver-ci.yml@v1
#
# Allowed labels: noBump | bumpPatch | bumpMinor | bumpMajor

name: semver-ci

on:
  workflow_call:
    inputs:
      standards-ref:
        description: Git ref of danielnachumdev/actions for scripts
        type: string
        default: "v1"
      timeout-minutes:
        description: Job timeout for the Semver label gate (minutes)
        type: number
        default: 5

permissions:
  contents: read
  pull-requests: read

jobs:
  semver:
    name: Semver
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout standards
        uses: actions/checkout@v7
        with:
          repository: danielnachumdev/actions
          ref: ${{ inputs.standards-ref }}
          path: .actions-standards

      - name: Require exactly one bump / noBump label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          python3 .actions-standards/scripts/release/release_semver.py \
            --latest-tag v0.0.0 \
            --labels-json "${LABELS_JSON}"
