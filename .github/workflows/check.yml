name: CI

# Dogfood orchestrator — same shape as templates/workflows/ci.yml, but pins
# relative `./` so this repository consumes its own building blocks.
# Required checks: "CI / CI" and "Semver / Semver".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/semver-ci.yml
    with:
      # Scripts from the same commit as the workflow under test.
      standards-ref: ${{ github.sha }}
