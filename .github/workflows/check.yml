name: CI

# Dogfood orchestrator — same shape as templates/workflows/ci.yml, but pins
# relative `./` so this repository consumes its own building blocks.
# Required checks: "CI / CI" and "Semver / Semver".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      # Same commit as the reusable workflow under test (detect-layout + script).
      standards-ref: ${{ github.sha }}
    # Optional: disable-* / working-directory / WIF / raft unlocks — see HOW-TO-USE.

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/semver-ci.yml
    with:
      # Scripts from the same commit as the workflow under test.
      standards-ref: ${{ github.sha }}
      # timeout-minutes: 5

  # Opt-in: merge Dependabot PRs after sibling CI jobs pass (dogfood).
  # needs: gates this last — list every PR job that must succeed first.
  dependabot-auto-merge:
    name: Merge Dependabot PR
    needs: [ci, semver]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dependabot-auto-merge.yml
