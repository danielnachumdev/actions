# Public CI building block — short pin:
#   uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
#
# workflow_call only. This repo dogfoods via check.yml (name: CI).
# Consumers copy templates/workflows/ci.yml (thin orchestrator).
#
# Note: GitHub forbids subdirectories under .github/workflows/ for reusable
# workflows. Organize with short flat names (ci, python, node, semver-ci, semver-cd).
# Composite actions MAY live under .github/actions/<name>/ (see detect-layout).
#
# Shared inputs run on both pre-merge (pull_request) and post-merge
# (push / workflow_dispatch). Optional *-push / skip-*-push override only on
# post-merge when set. For string *-push inputs: omitted and explicit "" both
# inherit the shared default (-n check) — "" does NOT mean "clear the matrix".
# To skip a lane on push, use skip-*-push (or disable-* for every event).
# Do not pass '[]' as a "run nothing" signal; that is a non-empty override.
# Consumers should NOT inject event_name expressions themselves.

name: ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repo-relative app root (monorepo package dir)
        type: string
        default: "."
      pyproject-path:
        description: pyproject.toml path relative to working-directory
        type: string
        default: "pyproject.toml"
      package-json-path:
        description: package.json path relative to working-directory
        type: string
        default: "package.json"
      python-versions:
        description: JSON array of Python versions (shared; both events)
        type: string
        default: '["3.11","3.12","3.13"]'
      python-versions-push:
        description: >-
          Optional post-merge override of python-versions. Omitted or "" inherits
          shared (not a clear). Use skip-python-push to skip the lane.
        type: string
        default: ""
      node-versions:
        description: JSON array of Node versions (shared; both events)
        type: string
        default: '["20","22"]'
      node-versions-push:
        description: >-
          Optional post-merge override of node-versions. Omitted or "" inherits
          shared (not a clear). Use skip-node-push to skip the lane.
        type: string
        default: ""
      sync-args:
        description: Extra args to uv sync (shared; both events)
        type: string
        default: "--group dev"
      sync-args-push:
        description: >-
          Optional post-merge override of sync-args. Omitted or "" inherits shared
          (not a clear).
        type: string
        default: ""
      pytest-command:
        description: >-
          Full pytest invocation under `uv run` in working-directory (same for PR
          and push; include flags in the command). Default `pytest -q`.
        type: string
        default: "pytest -q"
      disable-python:
        description: If true, never run the Python lane (any event)
        type: boolean
        default: false
      disable-node:
        description: If true, never run the Node lane (any event)
        type: boolean
        default: false
      skip-python-push:
        description: Skip Python lane on push/workflow_dispatch only
        type: boolean
        default: false
      skip-node-push:
        description: Skip Node lane on push/workflow_dispatch only
        type: boolean
        default: false
      allow-empty:
        description: If true, succeed when no lane is selected
        type: boolean
        default: false
      detect-timeout-minutes:
        description: Job timeout for Detect (minutes)
        type: number
        default: 5
      python-timeout-minutes:
        description: Job timeout passed to python.yml per matrix cell (minutes)
        type: number
        default: 30
      node-timeout-minutes:
        description: Job timeout passed to node.yml per matrix cell (minutes)
        type: number
        default: 30
      ci-timeout-minutes:
        description: Job timeout for the CI gate job (minutes)
        type: number
        default: 5

permissions:
  contents: read

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.detect-timeout-minutes }}
    outputs:
      run_python: ${{ steps.layout.outputs.run_python }}
      run_node: ${{ steps.layout.outputs.run_node }}
      working_directory: ${{ steps.layout.outputs.working_directory }}
      python_versions: ${{ steps.layout.outputs.python_versions }}
      node_versions: ${{ steps.layout.outputs.node_versions }}
      sync_args: ${{ steps.layout.outputs.sync_args }}
      pytest_command: ${{ steps.layout.outputs.pytest_command }}
    steps:
      - uses: actions/checkout@v7
      # Inline detect (not ./.github/actions/…): relative action paths resolve to the
      # *caller* repo when this workflow is used via workflow_call.
      - name: Detect layout + resolve event knobs
        id: layout
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory || '.' }}
          PYPROJECT_PATH: ${{ inputs.pyproject-path || 'pyproject.toml' }}
          PACKAGE_JSON_PATH: ${{ inputs.package-json-path || 'package.json' }}
          DISABLE_PYTHON: ${{ inputs.disable-python == true && 'true' || 'false' }}
          DISABLE_NODE: ${{ inputs.disable-node == true && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_VERSIONS: ${{ inputs.python-versions || '["3.11","3.12","3.13"]' }}
          PYTHON_VERSIONS_PUSH: ${{ inputs.python-versions-push }}
          NODE_VERSIONS: ${{ inputs.node-versions || '["20","22"]' }}
          NODE_VERSIONS_PUSH: ${{ inputs.node-versions-push }}
          SYNC_ARGS: ${{ inputs.sync-args || '--group dev' }}
          SYNC_ARGS_PUSH: ${{ inputs.sync-args-push }}
          PYTEST_COMMAND: ${{ inputs.pytest-command || 'pytest -q' }}
          SKIP_PYTHON_PUSH: ${{ inputs.skip-python-push == true && 'true' || 'false' }}
          SKIP_NODE_PUSH: ${{ inputs.skip-node-push == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          root="${WORKING_DIRECTORY:-.}"
          root="${root#./}"
          [[ -z "${root}" ]] && root="."
          pyproject="${root%/}/${PYPROJECT_PATH}"
          pyproject="${pyproject#./}"
          package_json="${root%/}/${PACKAGE_JSON_PATH}"
          package_json="${package_json#./}"

          # Shared defaults on both events; non-empty *-push only on post-merge.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            event_kind=pr
          else
            event_kind=push
          fi

          pick() {
            # pick <shared> <push_override>
            # Empty push override (omitted or "") → shared. Non-empty → override.
            # There is no "explicit empty clears the value" mode.
            local shared="$1" push="$2"
            if [[ "${event_kind}" == "push" && -n "${push}" ]]; then
              echo "${push}"
            else
              echo "${shared}"
            fi
          }

          python_versions="$(pick "${PYTHON_VERSIONS}" "${PYTHON_VERSIONS_PUSH}")"
          node_versions="$(pick "${NODE_VERSIONS}" "${NODE_VERSIONS_PUSH}")"
          sync_args="$(pick "${SYNC_ARGS}" "${SYNC_ARGS_PUSH}")"
          pytest_command="${PYTEST_COMMAND}"

          if [[ "${event_kind}" == "push" ]]; then
            skip_python="${SKIP_PYTHON_PUSH}"
            skip_node="${SKIP_NODE_PUSH}"
          else
            skip_python=false
            skip_node=false
          fi

          run_python=false
          if [[ "${DISABLE_PYTHON}" != "true" && "${skip_python}" != "true" && -f "${pyproject}" ]]; then
            run_python=true
          fi
          run_node=false
          if [[ "${DISABLE_NODE}" != "true" && "${skip_node}" != "true" && -f "${package_json}" ]]; then
            run_node=true
          fi

          {
            echo "working_directory=${root}"
            echo "run_python=${run_python}"
            echo "run_node=${run_node}"
            echo "python_versions=${python_versions}"
            echo "node_versions=${node_versions}"
            # Delimiter form so args may contain spaces / equals.
            echo "sync_args<<EOF_SYNC"
            echo "${sync_args}"
            echo "EOF_SYNC"
            echo "pytest_command<<EOF_PYTEST_CMD"
            echo "${pytest_command}"
            echo "EOF_PYTEST_CMD"
          } >> "$GITHUB_OUTPUT"

          echo "detect: event=${EVENT_NAME} kind=${event_kind} root=${root}"
          echo "detect: pyproject=${pyproject} package_json=${package_json}"
          echo "detect: run_python=${run_python} run_node=${run_node} skip_python=${skip_python} skip_node=${skip_node}"
          echo "detect: python_versions=${python_versions} node_versions=${node_versions}"
          echo "detect: sync_args=${sync_args} pytest_command=${pytest_command}"

  python:
    name: Python
    needs: [detect]
    if: needs.detect.outputs.run_python == 'true'
    uses: ./.github/workflows/python.yml
    with:
      working-directory: ${{ needs.detect.outputs.working_directory }}
      python-versions: ${{ needs.detect.outputs.python_versions }}
      sync-args: ${{ needs.detect.outputs.sync_args }}
      pytest-command: ${{ needs.detect.outputs.pytest_command }}
      timeout-minutes: ${{ inputs.python-timeout-minutes }}

  node:
    name: Node
    needs: [detect]
    if: needs.detect.outputs.run_node == 'true'
    uses: ./.github/workflows/node.yml
    with:
      working-directory: ${{ needs.detect.outputs.working_directory }}
      node-versions: ${{ needs.detect.outputs.node_versions }}
      timeout-minutes: ${{ inputs.node-timeout-minutes }}

  # Leaf name "CI" → consumer job named CI reports check "CI / CI".
  # !cancelled(): skip gate when concurrency cancels an in-flight run (avoids a
  # false FAILURE that blocks merge while the surviving run is green).
  ci:
    name: CI
    needs: [detect, python, node]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.ci-timeout-minutes }}
    steps:
      - name: Require success or intentional skip
        env:
          RUN_PYTHON: ${{ needs.detect.outputs.run_python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          RUN_NODE: ${{ needs.detect.outputs.run_node }}
          NODE_RESULT: ${{ needs.node.result }}
          ALLOW_EMPTY: ${{ inputs.allow-empty == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          echo "run_python=${RUN_PYTHON} python_result=${PYTHON_RESULT} run_node=${RUN_NODE} node_result=${NODE_RESULT} allow_empty=${ALLOW_EMPTY}"
          ok=false
          if [[ "${RUN_PYTHON}" == "true" ]]; then
            [[ "${PYTHON_RESULT}" == "success" ]]
            ok=true
          fi
          if [[ "${RUN_NODE}" == "true" ]]; then
            [[ "${NODE_RESULT}" == "success" ]]
            ok=true
          fi
          if [[ "${ok}" == "true" ]]; then
            exit 0
          fi
          if [[ "${ALLOW_EMPTY}" == "true" ]]; then
            echo "OK empty (no lanes)"
            exit 0
          fi
          echo "FAIL: no CI lane selected (set allow-empty: true or add pyproject.toml / package.json)"
          exit 1
