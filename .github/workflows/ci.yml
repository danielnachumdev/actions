# Public CI umbrella — short pin:
#   uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
#
# workflow_call only. Dogfood via check.yml (name: CI).
# Detect chooses lanes from layout under working-directory; disable-* / empty
# credentials skip lanes. Direct lane workflows remain callable alone.
#
# Shared inputs run on both pre-merge and post-merge. Optional *-push /
# skip-*-push override only on post-merge. Consumers should NOT inject
# event_name expressions themselves.

name: ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repo-relative app root (scoped marker root)
        type: string
        default: "."
      standards-ref:
        description: >-
          Ref of danielnachumdev/actions for detect-layout (default latest).
          Dogfood should pass github.sha.
        type: string
        default: latest
      pyproject-path:
        description: pyproject.toml path relative to working-directory
        type: string
        default: "pyproject.toml"
      package-json-path:
        description: package.json path relative to working-directory
        type: string
        default: "package.json"
      alembic-root:
        description: Alembic script root relative to working-directory
        type: string
        default: "alembic"
      rebase-base-ref:
        description: Git ref for rebase-guard (e.g. origin/main)
        type: string
        default: "origin/main"
      terraform-working-directory:
        description: Primary Terraform root relative to working-directory
        type: string
        default: "terraform"
      extra-terraform-module-paths:
        description: Comma-separated extra Terraform roots
        type: string
        default: ""
      terraform-version:
        description: Terraform CLI version
        type: string
        default: "1.9.8"
      workload_identity_provider:
        description: >-
          Full WIF provider resource name. Non-empty (with service_account)
          unlocks terraform plan/apply when a Terraform layout is detected.
        type: string
        default: ""
      service_account:
        description: GCP SA email for terraform plan/apply
        type: string
        default: ""
      skip-apply-push:
        description: Plan-only on push for terraform apply lane
        type: boolean
        default: false
      skip-fmt:
        description: Skip terraform fmt -check
        type: boolean
        default: false
      raft-app-manifest:
        description: Raft App YAML relative to working-directory
        type: string
        default: ".raft/app.yaml"
      raft-service:
        description: raft service name (with raft-git-repo + VPS_SSH_KEY unlocks raft)
        type: string
        default: ""
      raft-git-repo:
        description: Git remote URL for raft apply
        type: string
        default: ""
      raft-host:
        description: VPS host override (else vars.VPS_HOST)
        type: string
        default: ""
      raft-ssh-user:
        description: SSH user override (else vars.VPS_USER / raft)
        type: string
        default: ""
      python-versions:
        description: JSON array of Python versions (shared; both events)
        type: string
        default: '["3.11","3.12","3.13"]'
      python-versions-push:
        description: Optional post-merge override of python-versions
        type: string
        default: ""
      node-versions:
        description: >-
          JSON array of Node versions. Empty (default) infers from .nvmrc /
          package.json engines, else ["20","22"].
        type: string
        default: ""
      node-versions-push:
        description: Optional post-merge override of node-versions
        type: string
        default: ""
      sync-args:
        description: >-
          Extra args to uv sync. Empty (default) infers from pyproject
          dependency groups.
        type: string
        default: ""
      sync-args-push:
        description: Optional post-merge override of sync-args
        type: string
        default: ""
      pytest-command:
        description: Full pytest invocation under uv run (default pytest -q)
        type: string
        default: "pytest -q"
      disable-python:
        type: boolean
        default: false
      disable-node:
        type: boolean
        default: false
      disable-github-yaml:
        type: boolean
        default: false
      disable-rebase-guard:
        type: boolean
        default: false
      disable-terraform:
        type: boolean
        default: false
      disable-terraform-apply:
        type: boolean
        default: false
      disable-raft:
        type: boolean
        default: false
      skip-python-push:
        type: boolean
        default: false
      skip-node-push:
        type: boolean
        default: false
      allow-empty:
        description: If true, succeed when no CI lane is selected
        type: boolean
        default: false
      detect-timeout-minutes:
        type: number
        default: 5
      python-timeout-minutes:
        type: number
        default: 30
      node-timeout-minutes:
        type: number
        default: 30
      github-yaml-timeout-minutes:
        type: number
        default: 10
      rebase-guard-timeout-minutes:
        type: number
        default: 10
      terraform-validate-timeout-minutes:
        type: number
        default: 15
      terraform-timeout-minutes:
        type: number
        default: 30
      raft-timeout-minutes:
        type: number
        default: 15
      ci-timeout-minutes:
        type: number
        default: 5
    secrets:
      VPS_SSH_KEY:
        description: SSH private key for raft (optional; unlocks raft when layout matches)
        required: false

# Do not put id-token: write here — it forces every consumer (including
# allow-empty markdown repos) to grant OIDC at the caller or the reusable
# workflow fails at startup. Terraform plan/apply requests id-token on that
# job only; thin orchestrators that unlock WIF must set id-token: write
# themselves (see templates/workflows/ci.yml + HOW-TO-USE).
permissions:
  contents: read

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.detect-timeout-minutes }}
    outputs:
      run_python: ${{ steps.layout.outputs.run_python }}
      run_node: ${{ steps.layout.outputs.run_node }}
      run_github_yaml: ${{ steps.layout.outputs.run_github_yaml }}
      run_rebase_guard: ${{ steps.layout.outputs.run_rebase_guard }}
      run_terraform_validate: ${{ steps.layout.outputs.run_terraform_validate }}
      run_terraform_apply: ${{ steps.layout.outputs.run_terraform_apply }}
      run_raft: ${{ steps.layout.outputs.run_raft }}
      working_directory: ${{ steps.layout.outputs.working_directory }}
      terraform_working_directory: ${{ steps.layout.outputs.terraform_working_directory }}
      alembic_root: ${{ steps.layout.outputs.alembic_root }}
      raft_service: ${{ steps.layout.outputs.raft_service }}
      raft_git_repo: ${{ steps.layout.outputs.raft_git_repo }}
      python_versions: ${{ steps.layout.outputs.python_versions }}
      node_versions: ${{ steps.layout.outputs.node_versions }}
      sync_args: ${{ steps.layout.outputs.sync_args }}
      pytest_command: ${{ steps.layout.outputs.pytest_command }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout standards (detect-layout)
        uses: actions/checkout@v7
        with:
          repository: danielnachumdev/actions
          ref: ${{ inputs.standards-ref }}
          path: .actions-standards
          persist-credentials: false

      # Relative path resolves in the *caller* workspace after standards checkout.
      - name: Detect layout + resolve event knobs
        id: layout
        uses: ./.actions-standards/.github/actions/detect-layout
        with:
          working-directory: ${{ inputs.working-directory }}
          repo-root: "."
          pyproject-path: ${{ inputs.pyproject-path }}
          package-json-path: ${{ inputs.package-json-path }}
          alembic-root: ${{ inputs.alembic-root }}
          terraform-working-directory: ${{ inputs.terraform-working-directory }}
          extra-terraform-module-paths: ${{ inputs.extra-terraform-module-paths }}
          raft-app-manifest: ${{ inputs.raft-app-manifest }}
          raft-service: ${{ inputs.raft-service }}
          raft-git-repo: ${{ inputs.raft-git-repo }}
          has-vps-ssh-key: ${{ secrets.VPS_SSH_KEY != '' && 'true' || 'false' }}
          workload-identity-provider: ${{ inputs.workload_identity_provider }}
          service-account: ${{ inputs.service_account }}
          disable-python: ${{ inputs.disable-python == true && 'true' || 'false' }}
          disable-node: ${{ inputs.disable-node == true && 'true' || 'false' }}
          disable-github-yaml: ${{ inputs.disable-github-yaml == true && 'true' || 'false' }}
          disable-rebase-guard: ${{ inputs.disable-rebase-guard == true && 'true' || 'false' }}
          disable-terraform: ${{ inputs.disable-terraform == true && 'true' || 'false' }}
          disable-terraform-apply: ${{ inputs.disable-terraform-apply == true && 'true' || 'false' }}
          disable-raft: ${{ inputs.disable-raft == true && 'true' || 'false' }}
          allow-empty: ${{ inputs.allow-empty == true && 'true' || 'false' }}
          event-name: ${{ github.event_name }}
          python-versions: ${{ inputs.python-versions }}
          python-versions-push: ${{ inputs.python-versions-push }}
          node-versions: ${{ inputs.node-versions }}
          node-versions-push: ${{ inputs.node-versions-push }}
          sync-args: ${{ inputs.sync-args }}
          sync-args-push: ${{ inputs.sync-args-push }}
          pytest-command: ${{ inputs.pytest-command }}
          skip-python-push: ${{ inputs.skip-python-push == true && 'true' || 'false' }}
          skip-node-push: ${{ inputs.skip-node-push == true && 'true' || 'false' }}

  python:
    name: Python
    needs: [detect]
    if: needs.detect.outputs.run_python == 'true'
    uses: ./.github/workflows/python.yml
    with:
      working-directory: ${{ needs.detect.outputs.working_directory }}
      python-versions: ${{ needs.detect.outputs.python_versions }}
      sync-args: ${{ needs.detect.outputs.sync_args }}
      pytest-command: ${{ needs.detect.outputs.pytest_command }}
      timeout-minutes: ${{ inputs.python-timeout-minutes }}

  node:
    name: Node
    needs: [detect]
    if: needs.detect.outputs.run_node == 'true'
    uses: ./.github/workflows/node.yml
    with:
      working-directory: ${{ needs.detect.outputs.working_directory }}
      node-versions: ${{ needs.detect.outputs.node_versions }}
      timeout-minutes: ${{ inputs.node-timeout-minutes }}

  github-yaml:
    name: GitHub YAML
    needs: [detect]
    if: needs.detect.outputs.run_github_yaml == 'true'
    uses: ./.github/workflows/github-yaml.yml
    with:
      timeout-minutes: ${{ inputs.github-yaml-timeout-minutes }}

  rebase-guard:
    name: Rebase guard
    needs: [detect]
    if: needs.detect.outputs.run_rebase_guard == 'true'
    uses: ./.github/workflows/rebase-guard.yml
    with:
      alembic-root: ${{ needs.detect.outputs.alembic_root }}
      base-ref: ${{ inputs.rebase-base-ref }}
      timeout-minutes: ${{ inputs.rebase-guard-timeout-minutes }}

  terraform-validate:
    name: Terraform validate
    needs: [detect]
    if: needs.detect.outputs.run_terraform_validate == 'true'
    uses: ./.github/workflows/terraform-validate.yml
    with:
      working-directory: ${{ needs.detect.outputs.terraform_working_directory }}
      extra-module-paths: ${{ inputs.extra-terraform-module-paths }}
      terraform-version: ${{ inputs.terraform-version }}
      skip-fmt: ${{ inputs.skip-fmt }}
      timeout-minutes: ${{ inputs.terraform-validate-timeout-minutes }}

  terraform:
    name: Terraform
    needs: [detect]
    if: needs.detect.outputs.run_terraform_apply == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform.yml
    with:
      workload_identity_provider: ${{ inputs.workload_identity_provider }}
      service_account: ${{ inputs.service_account }}
      working-directory: ${{ needs.detect.outputs.terraform_working_directory }}
      terraform-version: ${{ inputs.terraform-version }}
      skip-apply-push: ${{ inputs.skip-apply-push }}
      skip-fmt: ${{ inputs.skip-fmt }}
      timeout-minutes: ${{ inputs.terraform-timeout-minutes }}

  raft:
    name: Raft
    needs: [detect]
    if: needs.detect.outputs.run_raft == 'true'
    uses: ./.github/workflows/raft-deploy.yml
    with:
      service: ${{ needs.detect.outputs.raft_service }}
      git-repo: ${{ needs.detect.outputs.raft_git_repo }}
      ref: ${{ github.sha }}
      host: ${{ inputs.raft-host }}
      ssh-user: ${{ inputs.raft-ssh-user }}
      timeout-minutes: ${{ inputs.raft-timeout-minutes }}
    secrets:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  # Leaf name "CI" → consumer job named CI reports check "CI / CI".
  ci:
    name: CI
    needs:
      [
        detect,
        python,
        node,
        github-yaml,
        rebase-guard,
        terraform-validate,
        terraform,
        raft,
      ]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.ci-timeout-minutes }}
    steps:
      - name: Require success or intentional skip
        env:
          RUN_PYTHON: ${{ needs.detect.outputs.run_python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          RUN_NODE: ${{ needs.detect.outputs.run_node }}
          NODE_RESULT: ${{ needs.node.result }}
          RUN_GITHUB_YAML: ${{ needs.detect.outputs.run_github_yaml }}
          GITHUB_YAML_RESULT: ${{ needs.github-yaml.result }}
          RUN_REBASE: ${{ needs.detect.outputs.run_rebase_guard }}
          REBASE_RESULT: ${{ needs.rebase-guard.result }}
          RUN_TF_VALIDATE: ${{ needs.detect.outputs.run_terraform_validate }}
          TF_VALIDATE_RESULT: ${{ needs.terraform-validate.result }}
          RUN_TF_APPLY: ${{ needs.detect.outputs.run_terraform_apply }}
          TF_APPLY_RESULT: ${{ needs.terraform.result }}
          RUN_RAFT: ${{ needs.detect.outputs.run_raft }}
          RAFT_RESULT: ${{ needs.raft.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          ALLOW_EMPTY: ${{ inputs.allow-empty == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "FAIL: Detect did not succeed (result=${DETECT_RESULT})"
            exit 1
          fi
          ok=false
          check_lane() {
            local name="$1" run="$2" result="$3"
            if [[ "${run}" == "true" ]]; then
              echo "lane ${name}: result=${result}"
              [[ "${result}" == "success" ]]
              ok=true
            fi
          }
          check_lane python "${RUN_PYTHON}" "${PYTHON_RESULT}"
          check_lane node "${RUN_NODE}" "${NODE_RESULT}"
          check_lane github-yaml "${RUN_GITHUB_YAML}" "${GITHUB_YAML_RESULT}"
          check_lane rebase-guard "${RUN_REBASE}" "${REBASE_RESULT}"
          check_lane terraform-validate "${RUN_TF_VALIDATE}" "${TF_VALIDATE_RESULT}"
          check_lane terraform "${RUN_TF_APPLY}" "${TF_APPLY_RESULT}"
          check_lane raft "${RUN_RAFT}" "${RAFT_RESULT}"
          if [[ "${ok}" == "true" ]]; then
            exit 0
          fi
          if [[ "${ALLOW_EMPTY}" == "true" ]]; then
            echo "OK empty (no lanes)"
            exit 0
          fi
          echo "FAIL: no CI lane selected"
          exit 1
