# Python/uv pytest matrix lane. Prefer calling ci.yml unless you need this alone.
#
#   uses: danielnachumdev/actions/.github/workflows/python.yml@v1

name: python

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions
        type: string
        default: '["3.11","3.12","3.13"]'
      working-directory:
        description: Directory containing pyproject.toml / uv.lock
        type: string
        default: "."
      sync-args:
        description: Extra args to uv sync
        type: string
        default: "--group dev"
      pytest-command:
        description: >-
          Full pytest invocation under `uv run` in working-directory
          (include flags here, e.g. `pytest . -q`). Default `pytest .`.
        type: string
        default: "pytest . -q"
      timeout-minutes:
        description: Job timeout for each matrix cell (minutes)
        type: number
        default: 30

permissions:
  contents: read

jobs:
  test:
    name: Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + deps
        run: uv sync ${{ inputs.sync-args }}
      - name: Pytest
        run: uv run ${{ inputs.pytest-command }}
