# Opt-in Dependabot merge. Call from the thin CI orchestrator via workflow_call
# after sibling PR jobs have passed. The caller must needs: every job that must
# succeed first so this runs last (with Semver: needs: [ci, semver]; without:
# needs: [ci] / aggregate id). Custom orchestrators: needs: the aggregate.
# Job-level contents/pull-requests write required on the caller.
#
# Path-filtered graphs: if the aggregate uses if: always() while some lanes are
# skipped, the caller if must include always() && needs.<id>.result == 'success'
# or GitHub skips this job while CI is green (see HOW-TO-USE.md).
#
# PRs that edit `.github/workflows/**` cannot be merged with GITHUB_TOKEN (no
# workflows scope on that token). Those merges are skipped with a notice so the
# job stays green; merge them manually (or with a PAT outside this workflow).
#
# Before merge, this workflow compares the PR's current headRefOid to
# github.sha. If Dependabot force-pushed / rebased while this run was still
# pending, HEAD has moved — we exit 0 and skip merge so a newer CI run wins.
# Sibling needs: alone is not enough: gh pr merge targets current HEAD, not
# the SHA that this workflow run tested.
#
# If branch protection requires checks that are not sibling jobs in the same
# workflow, those still must be green before merge can succeed — represent them
# via needs: or keep them out of required checks for Dependabot.
#
#   dependabot-auto-merge:
#     name: Merge Dependabot PR
#     needs: [ci, semver]   # or [ci] when Semver is omitted
#     if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@v1

name: dependabot-auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Caller should already gate on dependabot[bot]; keep a defense-in-depth check.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Merge Dependabot PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr diff "$PR_URL" --name-only | grep -q '^\.github/workflows/'; then
            echo "::notice::Skipping merge: PR updates workflow files; GITHUB_TOKEN cannot merge those changes. Merge manually."
            exit 0
          fi
          HEAD="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)"
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "PR HEAD moved ($HEAD != $GITHUB_SHA); skipping merge so newer CI can win."
            exit 0
          fi
          gh pr merge --squash --delete-branch "$PR_URL"
