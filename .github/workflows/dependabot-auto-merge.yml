# Opt-in Dependabot auto-merge. Call from the thin CI orchestrator (not a
# standalone consumer workflow). Requires repo "Allow auto-merge" and job-level
# contents/pull-requests write on the caller.
#
#   dependabot-auto-merge:
#     name: Dependabot auto-merge
#     if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@v1

name: dependabot-auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Caller should already gate on dependabot[bot]; keep a defense-in-depth check.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL"
