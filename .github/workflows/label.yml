# PR release-label gate — short pin:
#   uses: danielnachumdev/actions/.github/workflows/label.yml@v1
#
# Requires exactly one of: bumpMajor | bumpMinor | bumpPatch | noBump

name: label

on:
  workflow_call:
    inputs:
      standards-ref:
        description: Git ref of danielnachumdev/actions for scripts
        type: string
        default: "v1"

permissions:
  contents: read
  pull-requests: read

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout standards
        uses: actions/checkout@v7
        with:
          repository: danielnachumdev/actions
          ref: ${{ inputs.standards-ref }}
          path: .actions-standards

      - name: Require exactly one bump / noBump label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          python3 .actions-standards/scripts/release/release_semver.py \
            --latest-tag v0.0.0 \
            --labels-json "${LABELS_JSON}"
