# Opt-in Agent Skills validation (skills-ref + Cursor frontmatter allowlist).
# Call from the thin CI orchestrator when the repo hosts repo-root */SKILL.md dirs.
#
#   validate-skills:
#     name: Validate skills
#     uses: danielnachumdev/actions/.github/workflows/validate-skills.yml@latest
#
# Prefer requiring check "Validate skills / Validate skills".

name: validate-skills

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory under the caller checkout that contains skill folders
        type: string
        default: "."
      standards-ref:
        description: Git ref of danielnachumdev/actions for validate scripts
        type: string
        default: "latest"
      python-version:
        description: Python version for uv / skills-ref
        type: string
        default: "3.13"
      timeout-minutes:
        description: Job timeout (minutes)
        type: number
        default: 15

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7

      - name: Checkout standards (validate scripts)
        uses: actions/checkout@v7
        with:
          repository: danielnachumdev/actions
          ref: ${{ inputs.standards-ref }}
          path: .actions-standards
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}

      - name: Validate skills
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/.actions-standards/scripts/validate_skills.sh" "$(pwd)"
