name: CD

# Dogfood orchestrator — same shape as templates/workflows/cd.yml, relative `./`.
# Semver at CD: bump → wheel → GitHub Release (+ opt-in retags) or skip on noBump.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Defense in depth with the job if: (push + main). Limits which CI
    # completions even enqueue this privileged orchestrator.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read
  # Required by semver-cd (pypi job declares id-token: write even when skipped).
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  semver:
    name: Semver
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/semver-cd.yml
    with:
      standards-ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
      # Opt-in: force-move floating latest after each real release.
      retags: '["latest"]'
      # publish-pypi stays false (this repo is not a PyPI package).
      # Timeouts (optional): timeout-minutes / pypi-timeout-minutes / retag-timeout-minutes.
    # User-owned repos cannot use secrets: inherit — pass by name (may be empty).
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
